services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: case_clarity
      POSTGRES_PASSWORD: "LpjCBQGPm9BY87RzlQ6SdkTvSLI-mABi"
    volumes:
      - case_clarity_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "HCQsLEPQ9PbYf7vbWIrwQR27K79dTccD"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: case_clarity_test
      POSTGRES_PASSWORD: "cOXLFaniTEIKDESeUtcr0zXULQktzlG2"
    volumes:
      - case_clarity_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "6O31_ujGamYeih9lSug1LgUrD2nRm1T9"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  case_clarity_data:
  case_clarity_test_data:
